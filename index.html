<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E8799F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <title>Entrar</title>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/login.js" defer></script>
</head>

<body class="login">
  <!-- Colagem de fotos (definidas em js/config.js > IMAGENS.colagem) -->
  <div class="colagem c1" id="c1" aria-hidden="true"></div>
  <div class="colagem c2" id="c2" aria-hidden="true"></div>
  <div class="colagem c3" id="c3" aria-hidden="true"></div>
  <main class="card" id="card">
    <h1>Restaurante</h1>
    <form id="form" autocomplete="on">
      <div class="campo"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username"
          autocapitalize="none" required></div>
      <div class="campo"><label for="senha">Senha</label>
        <div class="senha"><input id="senha" name="senha" type="password" autocomplete="current-password" required>
          <button type="button" id="olho" aria-label="Mostrar ou ocultar senha" aria-pressed="false">👁</button>
        </div>
      </div>
      <button class="btn" type="submit">Entrar</button>
      <p id="erro" role="alert"></p>
    </form>

  </main>
</body>

</html>
