<!DOCTYPE html>
<html lang="pt-BR" data-protegida>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E8799F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/secreta.css">
  <title>♥</title>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/secreta.js" defer></script>
</head>

<body class="noite">
  <div id="entrada">
    <div>
      <p id="entrada-msg"></p><button class="btn" id="revelar">Abrir surpresa 💌</button>
    </div>
  </div>
  <div id="fundo" aria-hidden="true"></div>
  <div class="topo"><a class="btn btn-sec btn-sm" href="index.html">← Voltar</a>
    <nav><button class="btn btn-sec btn-sm" data-sair>Sair</button></nav>
  </div>
  <header class="cab">
    <p class="script">1 ano de nós</p>
    <h1>Nosso caminho até aqui</h1>
    <div class="contador" id="contador" aria-live="polite"></div>
    <p class="regressiva" id="regressiva"></p>
  </header>
  <main>
    <div class="linha" id="linha"></div>
    <section class="sec">
      <h2>Galeria de memórias</h2>
      <div class="galeria" id="galeria"></div>
    </section>
    <section class="sec">
      <h2>12 meses, 12 motivos</h2>
      <div class="motivos" id="motivos"></div>
    </section>
    <section class="sec">
      <h2>Uma carta para você</h2>
      <div class="carta" id="carta"></div>
    </section>
    <section class="sec">
      <h2>Um envelope para você</h2>
      <div class="envelope" id="envelope"><button type="button" aria-expanded="false" aria-label="Abrir envelope">
          <span class="env-fundo"></span><span class="env-carta" id="env-msg"></span><span
            class="env-frente"></span><span class="env-aba"></span></button>
        <p class="env-dica">Toque para abrir ✉️</p>
      </div>
    </section>
    <section class="sec">
      <h2>Nossa música</h2>
      <div class="musica"><span id="disco" aria-hidden="true">💿</span><strong id="nome-musica"></strong>
        <button class="btn" id="musica" type="button">▶ Tocar</button>
        <p id="erro-musica" role="status"></p>
      </div><audio id="audio" preload="none"></audio>
    </section>
    <section class="sec">
      <h2>Nossos planos</h2>
      <ul class="planos" id="planos"></ul>
    </section>
    <section class="sec">
      <h2>Céu de lembranças</h2>
      <div class="ceu" id="ceu"></div>
      <p class="ceu-msg" id="ceu-msg" role="status">Toque nas estrelas ✨</p>
    </section>
    <section class="sec">
      <h2>Uma última surpresa</h2>
      <div class="surpresa-box" id="surpresa-box"><button class="btn" id="surpresa-btn" type="button">Revelar
          💛</button>
        <p id="surpresa-msg"></p>
      </div>
    </section>
  </main>
  <footer class="final">
    <div class="pulsa" aria-hidden="true">❤️</div>
    <h2 id="titulo-final"></h2>
    <p class="script" id="declaracao"></p>
    <p class="script" id="mensagem-final"></p>
    <p class="script assinatura" id="assinatura-final"></p>
    <p class="feliz">Feliz 1 ano de nós. ❤️</p>
  </footer>
</body>

</html>
